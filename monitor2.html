<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Monitoramento Veicular</title>
    <style>
        html, body, #map { height: 100%; margin: 0; padding: 0; }
        #info { position: absolute; top: 10px; left: 10px; z-index: 1000; background: white; padding: 12px; font-family: Arial, sans-serif; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); color: #333; font-size: 14px; }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div id="info">Carregando última posição do veículo...</div>
    <div id="map"></div>

    <script>
        let map;
        let marker;
        // URL da sua API do Google Apps Script atualizada
        const urlAPI = "https://script.google.com/macros/s/AKfycbz21imKqw2LcP3lIzAF0d618vOMQUBqiss4_swISyPzfp0CjcI0Asu7Y7wWRpOImStUqw/exec";

        function initMap() {
            // Inicializa o mapa centralizado em Salvador/BA (ajustado para a sua coordenada base)
            map = L.map('map').setView([-12.9632, -38.4085], 15);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            }).addTo(map);
            
            atualizarLocalizacao();
            setInterval(atualizarLocalizacao, 15000); // Consulta a cada 15 segundos
        }

        function formatarDataLocal(dataString) {
            if (!dataString) return 'Agora';
            // Se já vier formatado em barra (dd/MM/yyyy), exibe direto
            if (dataString.includes('/')) return dataString;
            
            // Converte o formato UTC/ISO para o horário local do Brasil (GMT-3)
            const data = new Date(dataString);
            return data.toLocaleTimeString('pt-BR', { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit', second: '2-digit' }) + 
                   ' (' + data.toLocaleDateString('pt-BR', { timeZone: 'America/Sao_Paulo' }) + ')';
        }

        function atualizarLocalizacao() {
            fetch(urlAPI)
                .then(response => response.json())
                .then(data => {
                    if (data.lat && data.lng) {
                        const lat = parseFloat(data.lat);
                        const lng = parseFloat(data.lng);
                        const pos = [lat, lng];
                        
                        const horaFormatada = formatarDataLocal(data.timestamp);

                        document.getElementById("info").innerHTML = 
                            `<b>Última atualização:</b> ${horaFormatada}<br>` +
                            `<b>Lat/Lng:</b> ${lat.toFixed(4)}, ${lng.toFixed(4)}`;

                        if (!marker) {
                            marker = L.marker(pos).addTo(map).bindPopup("Veículo em Movimento").openPopup();
                        } else {
                            marker.setLatLng(pos);
                        }
                        map.setView(pos, map.getZoom());
                    }
                })
                .catch(err => console.error("Erro ao buscar dados:", err));
        }

        window.onload = initMap;
    </script>
</body>
</html>
